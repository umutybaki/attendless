AWSTemplateFormatVersion: '2010-09-09'
Description: One-time Attendless setup deployed by an administrator in the app's region - deployment artifact bucket, a permissions boundary, and the GitHub Actions OIDC role that deploys infra/template.yaml with least privilege.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref: [DEPLOY.md]
    arch: admin deploys once -> outputs become GitHub variables -> CI assumes DeployRole -> deploys AppStackName
    must:
      - same region as AppStackName (role ARNs are scoped to this stack's region); the certificate lives in infra/certificate.yaml (us-east-1)
      - one GitHub OIDC provider per account; pass GitHubOidcProviderArn if it exists
Parameters:
  GitHubRepository:
    Type: String
    Default: umutybaki/attendless
    AllowedPattern: '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+'
    Description: owner/name of the repository whose workflow deploys
  GitHubEnvironment:
    Type: String
    Default: production
    Description: GitHub environment the deploy job runs in (pinned in the role's trust policy)
  AppStackName:
    Type: String
    Default: attendless-production
    AllowedPattern: '[a-z][a-z0-9-]*'
    Description: Stack the role may deploy; lowercase so its generated S3 bucket names match
  GitHubOidcProviderArn:
    Type: String
    Default: ''
    Description: ARN of an existing token.actions.githubusercontent.com provider. Leave empty to create one.
Conditions:
  CreateOidc: !Equals [!Ref GitHubOidcProviderArn, '']
Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: content-addressed Lambda ZIPs; old keys stay for rollbacks, versioning guards against overwrite
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: tidy
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt ArtifactBucket.Arn, !Sub '${ArtifactBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # Caps every role the deploy role creates: even if a template grants more,
  # the Lambda can only log and use the app's own tables.
  LambdaBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Maximum permissions for Lambda roles created by the Attendless deploy role
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Logs
            Effect: Allow
            Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppStackName}-*'
          - Sid: RoomTable
            Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query]
            Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppStackName}-*'

  DeployRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: CloudFormation runs with the caller's credentials, so this role holds what the app stack needs; resource ARNs follow CFN generated names (<stack>-<LogicalId>-<suffix>)
        must:
          - trust stays pinned to repo + environment subject
          - CreateRole requires LambdaBoundary; DeleteRolePermissionsBoundary stays denied
          - PassRole only to lambda.amazonaws.com and only the stack's roles
    Properties:
      Description: Assumed by GitHub Actions to deploy the Attendless app stack
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateOidc, !Ref GitHubOidc, !Ref GitHubOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepository}:environment:${GitHubEnvironment}'
      Policies:
        - PolicyName: DeployAttendless
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Stack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/awscli-cloudformation-package-deploy-*/*'
              - Sid: StackRead
                Effect: Allow
                Action: [cloudformation:GetTemplateSummary, cloudformation:ValidateTemplate, cloudformation:DescribeEvents]
                Resource: '*'
              - Sid: Artifacts
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub '${ArtifactBucket.Arn}/${AppStackName}/*'
              - Sid: SiteBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:Get*
                  - s3:List*
                  - s3:PutBucket*
                  - s3:PutEncryptionConfiguration
                  - s3:DeleteBucketPolicy
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${AppStackName}-sitebucket-*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${AppStackName}-sitebucket-*/*'
              - Sid: Cdn
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:GetOriginAccessControlConfig
                  - cloudfront:CreateResponseHeadersPolicy
                  - cloudfront:UpdateResponseHeadersPolicy
                  - cloudfront:DeleteResponseHeadersPolicy
                  - cloudfront:GetResponseHeadersPolicy
                  - cloudfront:GetResponseHeadersPolicyConfig
                  - cloudfront:GetCachePolicy
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*'
                  - !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:origin-access-control/*'
                  - !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:response-headers-policy/*'
                  - !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:cache-policy/*'
              - Sid: CdnList
                Effect: Allow
                Action: [cloudfront:ListOriginAccessControls, cloudfront:ListResponseHeadersPolicies, cloudfront:ListCachePolicies, acm:ListCertificates]
                Resource: '*'
              # CloudFront certificates always live in us-east-1, whatever this stack's region.
              - Sid: CdnCertificate
                Effect: Allow
                Action: acm:DescribeCertificate
                Resource: !Sub 'arn:${AWS::Partition}:acm:us-east-1:${AWS::AccountId}:certificate/*'
              - Sid: Function
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:Get*
                  - lambda:List*
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:CreateFunctionUrlConfig
                  - lambda:UpdateFunctionUrlConfig
                  - lambda:DeleteFunctionUrlConfig
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppStackName}-*'
              - Sid: Table
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:UpdateTable
                  - dynamodb:DeleteTable
                  - dynamodb:Describe*
                  - dynamodb:List*
                  - dynamodb:GetResourcePolicy
                  - dynamodb:UpdateTimeToLive
                  - dynamodb:UpdateContinuousBackups
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppStackName}-*'
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                  - logs:TagLogGroup
                  - logs:ListTagsLogGroup
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppStackName}-*'
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppStackName}-*:*'
              - Sid: LogsList
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
              - Sid: RoleCreateWithBoundary
                Effect: Allow
                Action: [iam:CreateRole, iam:PutRolePermissionsBoundary]
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppStackName}-*'
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref LambdaBoundary
              - Sid: RoleManage
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:DeleteRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRoleTags
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:DetachRolePolicy
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppStackName}-*'
              - Sid: RoleAttachBasicExecutionOnly
                Effect: Allow
                Action: iam:AttachRolePolicy
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppStackName}-*'
                Condition:
                  ArnEquals:
                    iam:PolicyARN: !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
              - Sid: RolePassToLambdaOnly
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppStackName}-*'
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: KeepBoundary
                Effect: Deny
                Action: iam:DeleteRolePermissionsBoundary
                Resource: '*'
Outputs:
  DeploymentBucket:
    Description: GitHub variable DEPLOYMENT_BUCKET
    Value: !Ref ArtifactBucket
  DeployRoleArn:
    Description: GitHub variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  RoleBoundaryArn:
    Description: GitHub variable ROLE_BOUNDARY_ARN
    Value: !Ref LambdaBoundary
