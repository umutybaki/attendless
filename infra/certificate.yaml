AWSTemplateFormatVersion: '2010-09-09'
Description: TLS certificate for the Attendless custom domain. The only Attendless resource outside the main region, because CloudFront reads ACM certificates from us-east-1 only.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref: [DEPLOY.md]
    must:
      - us-east-1 only (enforced by Rules); app and bootstrap stacks stay in their own region
      - create completes only after the validation CNAMEs exist in Cloudflare (DNS only); keep them for renewals
Parameters:
  DomainName:
    Type: String
    Default: attendless.app
    Description: Apex domain; the certificate also covers www
Rules:
  CertificateRegion:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', us-east-1]
        AssertDescription: Deploy in us-east-1; CloudFront only accepts ACM certificates from there.
Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Metadata:
      com.aws.cloudformation.Context:
        why: DNS is at Cloudflare, not Route 53, so validation records are added by hand; ACM shows them while pending
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: [!Sub 'www.${DomainName}']
      ValidationMethod: DNS
Outputs:
  CertificateArn:
    Description: GitHub variable CERTIFICATE_ARN
    Value: !Ref Certificate
