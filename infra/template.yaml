AWSTemplateFormatVersion: '2010-09-09'
Description: Attendless static frontend on CloudFront (optionally under a custom domain), Go room and signaling Lambda, and ephemeral DynamoDB room state; video and links stay peer to peer.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref: [DEPLOY.md, DESIGN.md, backend/README.md]
    must:
      - deploy in us-east-1 when DomainName is set (ACM cert for CloudFront must live there)
      - every site origin (CloudFront host, custom domain, www) must be in BackendUrl CORS
      - BackendRole takes RoleBoundaryArn when deployed by the GitHub role (its CreateRole requires the boundary)
Parameters:
  CodeBucket:
    Type: String
    Description: Private artifact bucket in the deployment region
  CodeKey:
    Type: String
    Description: Key of the packaged Go Lambda ZIP
  DomainName:
    Type: String
    Default: ''
    Description: Apex domain served by CloudFront (www is added too). Leave empty to use the CloudFront hostname.
  CertificateArn:
    Type: String
    Default: ''
    Description: Issued us-east-1 ACM certificate covering DomainName and www.DomainName (output of infra/bootstrap.yaml)
  RoleBoundaryArn:
    Type: String
    Default: ''
    Description: Permissions boundary for the Lambda role (output of infra/bootstrap.yaml). Required when the GitHub deploy role deploys.
Conditions:
  HasDomain: !And
    - !Not [!Equals [!Ref DomainName, '']]
    - !Not [!Equals [!Ref CertificateArn, '']]
  HasBoundary: !Not [!Equals [!Ref RoleBoundaryArn, '']]
Resources:
  AttendanceTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires
        Enabled: true
  SiteBucket:
    Type: AWS::S3::Bucket
    Metadata:
      com.aws.cloudformation.Context:
        why: rebuilt from git on every deploy, so no versioning; only CloudFront reads it (OAC)
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: CSP lives in index.html (meta) so dev and tests enforce the same policy; these are header-only protections
        must:
          - Permissions-Policy keeps camera=(self); the camera role needs it
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security'
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: camera=(self), microphone=(), geolocation=(), payment=(), usb=()
              Override: true
  Site:
    Type: AWS::CloudFront::Distribution
    Metadata:
      com.aws.cloudformation.Context:
        why: custom domain is optional so a first deploy works before the certificate exists
        must:
          - Aliases need DNS (Cloudflare, DNS only) pointing at DistributionDomainName, or the domain serves nothing
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases: !If
          - HasDomain
          - [!Ref DomainName, !Sub 'www.${DomainName}']
          - !Ref AWS::NoValue
        Origins:
          - Id: static-site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccess
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: static-site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeaders
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Site}'
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt SiteBucket.Arn, !Sub '${SiteBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  BackendRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !If [HasBoundary, !Ref RoleBoundaryArn, !Ref AWS::NoValue]
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: AttendanceRoom
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query]
                Resource: !GetAtt AttendanceTable.Arn
  Backend:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Role: !GetAtt BackendRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref AttendanceTable
  BackendLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Backend}'
      RetentionInDays: 14
  BackendUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Backend.Arn
      AuthType: NONE
      Cors:
        AllowOrigins:
          - !Sub 'https://${Site.DomainName}'
          - !If [HasDomain, !Sub 'https://${DomainName}', !Ref AWS::NoValue]
          - !If [HasDomain, !Sub 'https://www.${DomainName}', !Ref AWS::NoValue]
          - http://localhost:3000
          - http://127.0.0.1:3000
        AllowMethods: [POST]
        AllowHeaders: [content-type, authorization]
        MaxAge: 300
  BackendUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Backend
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE
  BackendInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Backend
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true
Outputs:
  SiteUrl:
    Value: !If [HasDomain, !Sub 'https://${DomainName}', !Sub 'https://${Site.DomainName}']
  DistributionDomainName:
    Description: Target of the Cloudflare CNAME records for DomainName and www
    Value: !GetAtt Site.DomainName
  ApiUrl:
    Value: !GetAtt BackendUrl.FunctionUrl
  SiteBucket:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Site
  TableName:
    Value: !Ref AttendanceTable
